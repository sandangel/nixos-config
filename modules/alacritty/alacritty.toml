[colors.primary]
background = '#1e222a'
foreground = '#abb2bf'

[colors.cursor]
text   = '#1e222a'
cursor = '#61afef'

[colors.selection]
text       = '#1e222a'
background = '#3e4451'

[colors.normal]
black   = '#1e222a'
red     = '#e06c75'
green   = '#98c379'
yellow  = '#e5c07b'
blue    = '#61afef'
magenta = '#c678dd'
cyan    = '#56b6c2'
white   = '#abb2bf'

[colors.bright]
black   = '#545862'
red     = '#e06c75'
green   = '#98c379'
yellow  = '#e5c07b'
blue    = '#61afef'
magenta = '#c678dd'
cyan    = '#56b6c2'
white   = '#c8ccd4'

[window]
decorations = "None"
opacity = 0.85
padding = { x = 10, y = 10 }
# startup_mode = "Maximized"

[scrolling]
history = 100000

[font]
normal = { family = "Comic Code Ligatures", style = "Regular" }
bold = { family = "Comic Code Ligatures", style = "Regular" }
italic = { family = "Comic Code Ligatures", style = "Italic" }
bold_italic = { family = "Comic Code Ligatures", style = "Italic" }

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }

[keyboard]
bindings = [
  { key = "[", mods = "Control", action = "ToggleViMode" },
  { key = "V", mods = "Control", mode = "~Vi", action = "Paste" },
  { key = "Enter", mods = "Control|Shift", action = "CreateNewWindow" },
  { key = "+", mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "_", mods = "Control|Shift", action = "DecreaseFontSize" },
  { key = ")", mods = "Control|Shift", action = "ResetFontSize" },
]
